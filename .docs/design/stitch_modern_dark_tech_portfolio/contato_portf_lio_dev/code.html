<body class="text-on-background min-h-screen flex flex-col md:flex-row">
<!-- TopAppBar (Desktop) -->
<header class="hidden md:flex justify-between items-center px-grid-margin h-16 max-w-[1440px] mx-auto bg-surface/70 dark:bg-surface/70 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-white/10 shadow-[0_0_20px_rgba(0,243,255,0.1)]">

<span class="material-symbols-outlined text-primary dark:text-primary font-headline-sm text-headline-sm">terminal</span>
<span class="font-label-caps text-label-caps tracking-[0.2em] text-primary dark:text-primary-container drop-shadow-[0_0_8px_rgba(0,243,255,0.4)]">CMD_CENTER</span>

<nav class="flex gap-md">
<a class="text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-all duration-300 font-label-caps text-label-caps" href="#">HOME</a>

</nav>
<span class="material-symbols-outlined text-primary dark:text-primary font-headline-sm text-headline-sm hover:text-primary dark:hover:text-primary-fixed transition-all duration-300 cursor-pointer">settings_input_component</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1440px] mx-auto px-grid-margin py-xl md:pt-[120px] md:pb-xl flex flex-col items-center justify-center min-h-screen">
<div class="w-full max-w-2xl bg-white/[0.03] backdrop-blur-md border border-white/10 rounded-xl p-md md:p-lg shadow-2xl relative overflow-hidden">
<!-- Decorative corner elements -->
<div class="absolute top-0 left-0 w-4 h-4 border-t border-l border-primary/50"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t border-r border-primary/50"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b border-l border-primary/50"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b border-r border-primary/50"></div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs">INITIALIZE_CONTACT</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">Transmit data packet to establishing secure connection.</p>
<form class="space-y-md">
<div class="relative group">
<label class="block font-code-sm text-code-sm text-primary mb-base transition-all group-focus-within:text-primary-fixed" for="name">NAME_ID</label>
<input class="w-full bg-black border border-[#1A1A1B] text-on-surface font-body-md text-body-md rounded-DEFAULT px-sm py-3 input-glow transition-all outline-none" id="name" placeholder="Enter identifier" type="text"/>
</div>
<div class="relative group">
<label class="block font-code-sm text-code-sm text-primary mb-base transition-all group-focus-within:text-primary-fixed" for="email">COMM_LINK</label>
<input class="w-full bg-black border border-[#1A1A1B] text-on-surface font-body-md text-body-md rounded-DEFAULT px-sm py-3 input-glow transition-all outline-none" id="email" placeholder="Enter coordinates" type="email"/>
</div>
<div class="relative group">
<label class="block font-code-sm text-code-sm text-primary mb-base transition-all group-focus-within:text-primary-fixed" for="message">PAYLOAD</label>
<textarea class="w-full bg-black border border-[#1A1A1B] text-on-surface font-body-md text-body-md rounded-DEFAULT px-sm py-3 input-glow transition-all outline-none resize-none" id="message" placeholder="Enter data transmission" rows="4"></textarea>
</div>
<button class="w-full bg-primary text-[#000000] font-label-caps text-label-caps py-sm px-md rounded-DEFAULT hover:shadow-[0_0_20px_rgba(0,243,255,0.2)] hover:-translate-y-[2px] transition-all flex items-center justify-center gap-xs" type="button">
<span class="material-symbols-outlined">send</span>
                    TRANSMIT
                </button>
</form>
<div class="mt-lg pt-md border-t border-white/10 flex flex-col items-center gap-md">
<p class="font-code-sm text-code-sm text-on-surface-variant">OR CONNECT VIA EXTERNAL NODES</p>
<div class="flex gap-md">
<a class="w-12 h-12 rounded-full border border-primary/30 flex items-center justify-center text-primary hover:bg-primary/10 hover:border-primary hover:shadow-[0_0_15px_rgba(0,243,255,0.3)] transition-all group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">code</span>
</a>
<a class="w-12 h-12 rounded-full border border-primary/30 flex items-center justify-center text-primary hover:bg-primary/10 hover:border-primary hover:shadow-[0_0_15px_rgba(0,243,255,0.3)] transition-all group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">work</span>
</a>
<a class="w-12 h-12 rounded-full border border-primary/30 flex items-center justify-center text-primary hover:bg-primary/10 hover:border-primary hover:shadow-[0_0_15px_rgba(0,243,255,0.3)] transition-all group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">chat</span>
</a>
</div>
<button class="mt-xs font-code-sm text-code-sm text-primary flex items-center gap-xs hover:text-primary-fixed transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
                    COPY_COMM_LINK
                </button>
</div>
</div>

<span class="material-symbols-outlined">send</span>
<span class="font-label-caps text-label-caps mt-1">CONTACT</span>
</a>
